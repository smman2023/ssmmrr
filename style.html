<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{

background:
linear-gradient(135deg,#0F4C81,#1976D2,#64B5F6);

background-size:300% 300%;

animation:bgMove 10s ease infinite;

min-height:100vh;

padding:40px 15px;

}

@keyframes bgMove{

0%{background-position:left;}

50%{background-position:right;}

100%{background-position:left;}

}

.container{

max-width:650px;

margin:auto;

}

.card{

background:#fff;

border-radius:30px;

padding:35px;

box-shadow:
0 25px 60px rgba(0,0,0,.25);

}

.hero{

text-align:center;

margin-bottom:35px;

}

.logoCircle{

width:90px;

height:90px;

margin:auto;

border-radius:50%;

background:linear-gradient(135deg,#1565C0,#42A5F5);

display:flex;

align-items:center;

justify-content:center;

font-size:42px;

color:white;

box-shadow:0 15px 35px rgba(21,101,192,.35);

margin-bottom:20px;

}

.hero h1{

font-size:34px;

font-weight:800;

color:#0D47A1;

}

.hero p{

margin-top:10px;

font-size:17px;

color:#666;

}

.form-group{

margin-bottom:22px;

}

label{

display:block;

margin-bottom:8px;

font-size:15px;

font-weight:700;

color:#444;

}

input,
select{

width:100%;

height:58px;

padding:15px;

font-size:16px;

border-radius:16px;

border:2px solid #E3EAF3;

background:#F9FBFD;

transition:.3s;

}

input:focus,
select:focus{

outline:none;

border-color:#1976D2;

background:white;

box-shadow:

0 0 0 4px rgba(25,118,210,.15);

}

button{

width:100%;

height:60px;

border:none;

border-radius:18px;

background:

linear-gradient(135deg,#1565C0,#1E88E5);

color:white;

font-size:21px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-3px);

box-shadow:

0 15px 30px rgba(21,101,192,.35);

}

button:active{

transform:scale(.98);

}

.success{

color:#0F9D58;

text-align:center;

font-weight:bold;

margin-top:20px;

}

.error{

color:#D93025;

text-align:center;

font-weight:bold;

margin-top:20px;

}

@media(max-width:600px){

.card{

padding:22px;

}

.hero h1{

font-size:26px;

}

.logoCircle{

width:70px;

height:70px;

font-size:32px;

}

}

</style>
